[build]
  publish = "public"
  command = "npm run build"
  functions = "lambda"
[build.environment]
  NODE_VERSION = "16.8"
  YARN_VERSION = "1.22.4"
  YARN_FLAGS = "--no-ignore-optional"

# Old Algorithmic Trading Course page has been replaced by Auto Strategy Club.
[[redirects]]
  from = "/algorithms"
  to = "/auto-strategy-club"
  status = 301
  force = true

# Free Trials page was reverted back to the Indicators page.
[[redirects]]
  from = "/free-trials"
  to = "/indicators"
  status = 301
  force = true
